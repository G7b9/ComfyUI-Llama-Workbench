[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-llama-workbench"
version = "0.1.0"
description = "Coexisting ComfyUI workbench for llama-server, embedded llama-cpp-python, chat, and prompt skills"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "requests>=2.31.0",
  "pillow>=10.0.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
embedded = ["llama-cpp-python>=0.3.37"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
